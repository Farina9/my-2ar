<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نمایش واقعیت افزوده</title>

  <!-- لود کتابخانه‌ها از فایل‌های محلی مخزن -->
  <script src="./aframe.min.js"></script>
  <script src="./mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    /* حذف کامل و دائمی آیکون‌ها و پنجره‌های حالت VR و AR */
    .a-enter-vr,
    .a-enter-ar,
    .a-enter-vr-button,
    .a-orientation-modal {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }
  </style>
</head>

<body>
  <!-- صحنه واقعیت افزوده همراه با غیرفعال‌سازی UI حالت‌های VR/XR -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 2;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    xr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <!-- بارگذاری مدل‌ها -->
    <a-assets timeout="15000">
      <a-asset-item id="model1" src="./model1.glb"></a-asset-item>
      <a-asset-item id="model2" src="./model2.glb"></a-asset-item>
    </a-assets>

    <!-- تنظیمات نورپردازی مناسب محیط و مدل -->
    <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.5" position="1 2 3"></a-light>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- تارگت اول: چرخش خودکار دورانی و سایز بزرگ -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-entity
        position="0 0 0.05"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
        <a-gltf-model
          src="#model1"
          position="0 0 0"
          scale="1.2 1.2 1.2">
        </a-gltf-model>
      </a-entity>
    </a-entity>

    <!-- تارگت دوم: چرخش خودکار دورانی و سایز بزرگ -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-entity
        position="0 0 0.05"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
        <a-gltf-model
          src="#model2"
          position="0 0 0"
          scale="1.2 1.2 1.2">
        </a-gltf-model>
      </a-entity>
    </a-entity>

  </a-scene>
</body>
</html>
